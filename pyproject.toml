[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp3gain-gui-py"
version = "0.1.0"
description = "PySide6 port of MP3Gain GUI - ReplayGain analysis and gain adjustment"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MT0z", email = "mt0z1@pir0z.yxz" }]
requires-python = ">=3.13"
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [

  "threep-commons @ git+https://github.com/Threepwood-7/threep-commons@v0.3.0",


  "PySide6>=6.10.2",

  "mutagen>=1.47",

  "miniaudio>=1.60",

]

[project.optional-dependencies]
fast = ["numpy>=1.26"]
parity = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/Threepwood-7/mp3gain-gui-py"
Repository = "https://github.com/Threepwood-7/mp3gain-gui-py"
Issues = "https://github.com/Threepwood-7/mp3gain-gui-py/issues"

[tool.hatch.env]
installer = "uv"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mp3gain_gui_py"]

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "openpyxl>=3.1",

  "pytest-qt>=4.4",
  "PySide6>=6.10.2",

]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=src/mp3gain_gui_py --cov-report=term-missing --cov-report=xml {args:tests}"
package-standalone = "python scripts/windows/build_nuitka.py {args}"

[tool.hatch.envs.lint]
dependencies = [
  "ruff>=0.6",
  "basedpyright>=1.18",
  "deptry>=0.24",
  "vulture>=2.15",
]

[tool.hatch.envs.lint.scripts]
check = "ruff check ."
fmt = "ruff format --check ."
fix = ["ruff check --fix .", "ruff format ."]
types = "basedpyright src/mp3gain_gui_py"
deps = "deptry ."
deadcode = "vulture src --min-confidence 80"
complexity = "ruff check src --select C901 --output-format concise"
policy = "python scripts/policy/check_standard.py"
all = [
  "ruff check --fix .",
  "ruff format .",
  "basedpyright src/mp3gain_gui_py",
  "python scripts/policy/check_standard.py",
]

[tool.hatch.envs.test]
dependencies = [
  "pytest>=8.0",
  "pytest-cov>=5.0",

  "pytest-qt>=4.4",
  "PySide6>=6.10.2",

]

[[tool.hatch.envs.test.matrix]]
python = ["3.13"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"

[tool.hatch.envs.package]
dependencies = [
  "Nuitka>=4.0.6",
  "zstandard>=0.25.0",
]

[tool.hatch.envs.package.scripts]
standalone = "python scripts/windows/build_nuitka.py {args}"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "B",
  "C4",
  "UP",
  "SIM",
  "TCH",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["mp3gain_gui_py"]

[tool.ruff.lint.pep8-naming]
ignore-names = [
  "activateWindow",
  "angleDelta",
  "closeEvent",
  "changeEvent",
  "columnCount",
  "dragEnterEvent",
  "drawBackground",
  "drawForeground",
  "drawInlineImage",
  "dropEvent",
  "enterEvent",
  "eventFilter",
  "filePath",
  "filterAcceptsRow",
  "headerData",
  "highlightBlock",
  "isActive",
  "isRunning",
  "keyPressEvent",
  "lessThan",
  "leaveEvent",
  "mouseDoubleClickEvent",
  "mouseMoveEvent",
  "mousePressEvent",
  "mouseReleaseEvent",
  "moveEvent",
  "nameFilterDisables",
  "nameFilters",
  "paintEvent",
  "rowCount",
  "requestInterruption",
  "resizeEvent",
  "setFilter",
  "setApplicationDisplayName",
  "setApplicationName",
  "setNameFilterDisables",
  "setNameFilters",
  "setOrganizationName",
  "setObjectName",
  "setPageSize",
  "setProperty",
  "setReadOnly",
  "setRootPath",
  "setText",
  "showPage",
  "showEvent",
  "showNormal",
  "stepBy",
  "wheelEvent",
  "windowState",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.deptry]
known_first_party = ["mp3gain_gui_py", "_common", "parity_common"]
per_rule_ignores = { DEP002 = ["numpy"] }

[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
stubPath = "typings"
include = ["src"]
exclude = ["tests", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
markers = [
  "integration: integration tests",

  "gui: GUI/Qt tests",

  "slow: slow tests",
]

[tool.coverage.run]
source = ["src/mp3gain_gui_py"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.workspace.nuitka]
app_package = "mp3gain_gui_py"
output_name = "mp3gain-gui-py"
mode = "standalone"
windows_console_mode = "disable"
enable_plugins = ["pyside6"]
include_qt_plugins = []
include_data_files = []
